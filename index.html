<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login page split screen</title>
    <link rel="stylesheet" href="Login.css">
</head>
<body>
    <main class="split-screen">
        <!-- Left Section: hanya menampilkan gambar background dari loginbg.png -->
        <section class="left">
        </section>
        <!-- Right Section -->
        <section class="right">
            <div class="login-container">
                <img src="Gambar/loginbg-cropped.png" alt="Logo" class="logo">
                <h1>Welcome</h1>
                <p>Let's get started! to build your artwork</p>
                <form class="login-form" action="#" method="post">
                    <button type="button" class="sso-btn" aria-label="Sign in with Google">
                        <img src="Gambar/icons8-google-48.png" alt="Google"> Sign in with Google
                    </button>
                    <div class="divider"><span>or</span></div>
                    <label for="email">Email/Username</label>
                    <input type="text" id="email" name="email" required>
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                    <a href="#" class="forgot">Forgot Password?</a>
                    <div class="remember">
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember">Remember Me</label>
                    </div>
                    <button type="submit" class="sign-in">Sign In</button>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
